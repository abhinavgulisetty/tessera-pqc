[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-pqc"
version = "0.2.0"
description = "Post-Quantum Cryptography Simulation Framework with Side-Channel Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Abhinav Gulisetty", email = "abhinavgulisetty@gmail.com"}
]
keywords = [
    "post-quantum", "cryptography", "kyber", "dilithium", "ntt", "lattice",
    "intermittent-computing", "iot", "simulation", "pqc", "side-channel",
    "dpa", "cpa", "power-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "simpy>=4.0",
    "matplotlib>=3.7",
    "rich>=13.0",
    "numba>=0.58",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "plotly>=5.15",
]

[project.urls]
Homepage = "https://github.com/abhinavgulisetty/tessera-pqc"
Repository = "https://github.com/abhinavgulisetty/tessera-pqc"
Issues = "https://github.com/abhinavgulisetty/tessera-pqc/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
]
notebook = [
    "jupyter>=1.0",
]

[project.scripts]
tessera = "tessera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
